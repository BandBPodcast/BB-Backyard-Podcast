name: B&B Social Sync

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bb-social-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check YouTube and Twitch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: BnBEntertains
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_CHANNEL: bandbpodcast
        run: node scripts/update-social-feed.mjs
      - name: Publish feed changes
        run: |
          if git diff --quiet -- data/social-feed.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "B&B Social Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/social-feed.json
          git commit -m "Auto-update B&B social feed"
          git push
